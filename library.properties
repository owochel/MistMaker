sentence=A library to control a mist maker under OSHWA ID US002742 with PWM, current sensing, and battery monitoring.
paragraph=Encapsulates mist maker control functions: 108.7kHz PWM with dimming, piezo current sensing with auto/manual calibration, disc and water-level detection, battery voltage monitoring with USB-vs-cell power-source detection (mux status) and graceful low-battery shutdown, and pin presets for all official Programmable Mist Maker PCB variants (through Battery Kit V0.4.1, the July 2026 production board). Runs on Seeed XIAO ESP32 boards and, over jumper wires, Arduino Uno R3, Uno R4, Nano 33 IoT, and Nano 33 BLE.
category=Signal Input/Output
url=https://github.com/Dav1dyang/Programmable-Mist-Maker
architectures=esp32,avr,samd,renesas_uno,mbed_nano
